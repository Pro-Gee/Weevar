name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build playground (public demo bundle)
        run: npm run build:playground:demo

      - name: Unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npm run test:e2e:setup

      - name: E2E tests
        run: npm run test:e2e

      - name: Package dry run
        run: npm pack -w weevar --dry-run
