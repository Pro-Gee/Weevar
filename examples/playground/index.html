<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <!-- Primary SEO — edit title + description for how you want Google/snippets to read -->
    <title>Weevar playground</title>
    <meta
      name="description"
      content="An interactive playground for trying out Weevar."
    />
    <link rel="canonical" href="https://weevar-playground.vercel.app/" />
    <!-- Default chrome hint (matches playground dark shell); optional -->
    <meta name="theme-color" content="#09090b" />

    <!-- Open Graph — absolute https URLs; keep origin in sync with canonical -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weevar" />
    <meta property="og:title" content="Weevar playground" />
    <meta
      property="og:description"
      content="An interactive playground for trying out Weevar."
    />
    <meta property="og:url" content="https://weevar-playground.vercel.app/" />
    <meta property="og:image" content="https://weevar-playground.vercel.app/og.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="537" />
    <meta
      property="og:image:alt"
      content="Weevar overlay mockup: Overview dashboard, stats, and documentation link"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weevar playground" />
    <meta
      name="twitter:description"
      content="An interactive playground for trying out Weevar."
    />
    <meta name="twitter:image" content="https://weevar-playground.vercel.app/og.png" />

    <link rel="icon" type="image/png" href="/favicon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script>
      (function () {
        try {
          /* Replaced at build time when VITE_WEEVAR_PUBLIC_DEMO is set (see Vite HTML env substitution). */
          var demo = "%VITE_WEEVAR_PUBLIC_DEMO%" === "true";
          if (demo) return;
          var t = localStorage.getItem("pg-theme");
          if (t === "light") document.documentElement.setAttribute("data-theme", "light");
          else if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
