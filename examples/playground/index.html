<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Weevar playground</title>
    <script>
      (function () {
        try {
          /* Replaced at build time when VITE_WEEVAR_PUBLIC_DEMO is set (see Vite HTML env substitution). */
          var demo = "%VITE_WEEVAR_PUBLIC_DEMO%" === "true";
          if (demo) return;
          var t = localStorage.getItem("pg-theme");
          if (t === "light") document.documentElement.setAttribute("data-theme", "light");
          else if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
